name: Issue 1642 patched pipeline validation
on:
  push:
    branches: [codex/issue-1642-fix-20261101]
    paths:
      - '.github/workflows/issue-1642-fix.yml'
      - '.ci/issue-1642-fix/**'
permissions:
  contents: read
concurrency:
  group: issue-1642-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'MertBasar0/openclaw-windows-node'
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Preserve source bytes and isolate tools
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve source bytes.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve source bytes.' }
          "DOTNET_CLI_HOME=$(Join-Path $env:RUNNER_TEMP 'issue1642-dotnet')" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'issue1642-nuget')" >> $env:GITHUB_ENV
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openclaw/openclaw-windows-node
          ref: ef1df54dfe95a8b0a2ae8033425561136d8a70ef
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\issue1642-sdk
        with:
          dotnet-version: '10.0.402'
      - name: Build and run full suites requiring all 25 issue cases to pass
        run: |
          & ./control/.ci/issue-1642-fix/Run-Green.ps1 -RepoRoot ./source -OutputRoot ./prepared
      - name: Record exact result and proof limits
        if: always()
        run: |
          if (Test-Path prepared/evidence/validation-result.json) { Get-Content prepared/evidence/validation-result.json >> $env:GITHUB_STEP_SUMMARY }
          'Pipeline/component proof only. The standalone HTTP fixture does not verify production Updatum transport, native UI, installation or activation. No local installed environment was used.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain exact build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1642-fix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared/evidence/
          retention-days: 7
          if-no-files-found: warn

name: Issue 1676 isolated native update
on:
  push:
    branches: [codex/issue-1676-native-20261031]
    paths:
      - '.github/workflows/issue-1676-native.yml'
      - '.ci/issue-1676-native/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: issue-1676-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'MertBasar0/openclaw-windows-node'
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Preserve reviewed source bytes and isolate tool state
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve source bytes.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve source bytes.' }
          "DOTNET_CLI_HOME=$(Join-Path $env:RUNNER_TEMP 'issue1676-dotnet')" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'issue1676-nuget')" >> $env:GITHUB_ENV
      - name: Check out reviewed native test only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Select SDK without changing product runtime
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'
      - name: Reuse completed pinned A B and hook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-1676-test-artifacts-41215893003-1
          run-id: 41215893003
          repository: MertBasar0/openclaw-windows-node
          github-token: ${{ github.token }}
          path: inputs
      - name: Qualify desktop and execute actual installed-process update
        run: |
          & ./control/.ci/issue-1676-native/Run-Native.ps1 -ArtifactRoot ./inputs
      - name: Record exact result and limits
        if: always()
        run: |
          if (Test-Path C:/OC1676Actions/public/native-result.json) {
            Get-Content C:/OC1676Actions/public/native-result.json >> $env:GITHUB_STEP_SUMMARY
          }
          'Controlled install boundary only. No release discovery/network download or Windows 11 equivalence. Product source unchanged; no shared gateway. Memory dumps are never uploaded.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain selected synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1676-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:/OC1676Actions/public/
          retention-days: 7
          if-no-files-found: warn

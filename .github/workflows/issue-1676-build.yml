name: Issue 1676 isolated build preparation

on:
  push:
    branches: [codex/issue-1676-build-20261031]
    paths:
      - '.github/workflows/issue-1676-build.yml'
      - '.ci/issue-1676/**'

permissions:
  contents: read

concurrency:
  group: issue-1676-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'MertBasar0/openclaw-windows-node'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Preserve input bytes and isolate build state
        run: |
          "DOTNET_CLI_HOME=$(Join-Path $env:RUNNER_TEMP 'issue1676-dotnet')" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'issue1676-nuget')" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve source bytes.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve source bytes.' }

      - name: Check out reviewed preparation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out pinned unchanged product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openclaw/openclaw-windows-node
          ref: a4dd026cc5f85a444a0fcd05eef5b86282dbda8c
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Select SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'

      - name: Build hook, A installer and B ZIP without installing or launching them
        run: |
          & ./control/.ci/issue-1676/Build-Candidates.ps1 -RepoRoot ./source -OutputRoot ./prepared

      - name: Explain proof limits
        if: always()
        run: |
          if (Test-Path ./prepared/evidence/build-result.json) {
            Get-Content ./prepared/evidence/build-result.json >> $env:GITHUB_STEP_SUMMARY
          }
          'Build preparation only. No Companion installation, application launch, update, restart, Windows 11 UI proof or hook-absence proof was performed.' >> $env:GITHUB_STEP_SUMMARY

      - name: Retain build receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1676-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared/evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: Retain unsigned local test artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1676-test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared/transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
